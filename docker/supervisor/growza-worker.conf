; Production Supervisor unit for queue workers — see DEPLOYMENT.md for
; installation steps. One program block per queue group so a payments
; backlog can never starve report-generation workers or vice versa
; (ARCHITECTURE.md §12).
[program:growza-queue-payments]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/growza/artisan queue:work redis --queue=payments --sleep=3 --tries=3 --backoff=5 --max-time=3600
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/growza/storage/logs/worker-payments.log
stopwaitsecs=3600

[program:growza-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/growza/artisan queue:work redis --queue=orders,providers,refunds,notifications,reports,maintenance --sleep=3 --tries=3 --backoff=5 --max-time=3600
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/growza/storage/logs/worker-default.log
stopwaitsecs=3600
